name: CI

# P2-1 构建优化：每次 push / PR 自动跑单元测试 + lint + 无签名 debug 打包。
# 注意：release 签名需要 DIANGUARD_KEYSTORE_PATH 等密钥，CI 不持有，故只构建 debug。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit Test + Lint + Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 模拟本地 secrets.properties 缺失的环境：签名块需容错（secretsProperties 为空 Properties，
      # signingCredential 返回 null 时 AGP 允许 null 密码用于 debug；release 需密钥故 CI 不跑 assembleRelease）
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint check
        run: ./gradlew lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dianguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
